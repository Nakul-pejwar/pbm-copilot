services:
  postgres:
    image: postgres:16-alpine
    container_name: pbm_postgres
    environment:
      POSTGRES_DB: pbm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pbm_postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pbm"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pbm_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: pbm_api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pbm
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: pbm_superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-this-demo-secret-key}
      DATABASE_DB: pbm
      DATABASE_HOST: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "superset fab create-admin
      --username admin
      --firstname PBM
      --lastname Admin
      --email admin@pbm.local
      --password admin
      || true;
      superset db upgrade;
      superset init;
      /usr/bin/run-server.sh"

volumes:
  pbm_postgres_data:
